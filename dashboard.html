<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOTI BUILDER - Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --primary:#4F46E5; --primary-dark:#4338CA; --bg:#F8FAFC; --card:#FFFFFF;
  --text:#0F172A; --text-2:#64748B; --border:#E2E8F0; --success:#10B981; --danger:#EF4444; --warning:#F59E0B;
  --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hind Siliguri','Inter',sans-serif;background:var(--bg);color:var(--text)}
body.en{font-family:'Inter','Hind Siliguri',sans-serif}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit}

/* Header */
.header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.header-wrap{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--primary)}
.brand i{font-size:22px}
.header-right{display:flex;align-items:center;gap:12px}
.lang-switch{display:flex;background:#F1F5F9;border-radius:8px;padding:3px}
.lang-switch button{padding:5px 10px;font-size:12px;font-weight:600;border-radius:6px;transition:.2s}
.lang-switch button.active{background:var(--primary);color:#fff}
.user-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#E2E8F0;border:2px solid var(--primary)}
.hamburger{display:none;font-size:20px;color:var(--text-2)}

/* Sidebar Drawer */
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);padding:16px;position:fixed;right:-280px;top:0;height:100vh;z-index:60;transition:.3s;overflow-y:auto}
.sidebar.open{right:0}
.sidebar h3{font-size:12px;color:var(--text-2);text-transform:uppercase;margin:12px 0 8px 8px}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text-2);font-weight:500;font-size:14px;transition:.2s;margin-bottom:2px}
.sidebar-link:hover{background:#F1F5F9;color:var(--primary)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
.sidebar-overlay.show{display:block}

/* Container */
.container{max-width:1400px;margin:0 auto;padding:16px}

/* Hero Card */
.hero-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.shop-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary);background:#E2E8F0}
.shop-info h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.verified-badge{font-size:11px;background:#DBEAFE;color:var(--primary);padding:3px 8px;border-radius:20px;font-weight:600}
.shop-info p{color:var(--text-2);font-size:13px;margin-top:4px}

/* Banner Slider */
.banner-slider{position:relative;width:100%;aspect-ratio:981/363;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;touch-action:pan-y}
.banner-track{display:flex;transition:transform 0.5s ease; height:100%}
.banner-slide{flex:0 0 100%;position:relative}
.banner-slide img{width:100%;height:100%;object-fit:cover}
.banner-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.banner-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);transition:.3s;cursor:pointer}
.banner-dot.active{width:24px;background:#fff;border-radius:12px}

/* URL Card */
.url-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.url-card h3{font-size:15px;margin-bottom:6px}
.url-link{font-family:monospace;background:#F1F5F9;padding:8px 12px;border-radius:8px;font-size:13px;word-break:break-all}
.btn{padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#F1F5F9;color:var(--text)}

/* Grid Cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow);transition:.2s;display:flex;align-items:center;gap:12px}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 12px rgba(0,0,0,0.08)}
.card-icon{width:40px;height:40px;border-radius:10px;background:#EEF2FF;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-content h3{font-size:14px;font-weight:600;margin-bottom:2px}
.card-content p{font-size:11px;color:var(--text-2)}

/* Subscription Card */
.sub-card{background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 100%);color:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
.sub-card.expired{background:linear-gradient(135deg,#EF4444 0%,#F97316 100%)}
.sub-card.warning{background:linear-gradient(135deg,#F59E0B 0%,#F97316 100%)}
.countdown{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.count-box{background:rgba(255,255,255,.15);padding:10px;border-radius:10px;text-align:center;min-width:65px}
.count-box .num{font-size:24px;font-weight:700}
.count-box .label{font-size:11px;opacity:.8}

/* Coming Soon */
.coming-grid{opacity:.5}

/* Error Card */
.error-card{background:var(--card);border:2px solid var(--danger);border-radius:var(--radius);padding:30px;text-align:center}
.error-card i{font-size:48px;color:var(--danger);margin-bottom:12px}

/* Toast */
.toast{position:fixed;top:20px;right:20px;background:var(--text);color:#fff;padding:12px 16px;border-radius:8px;z-index:100;opacity:0;transform:translateY(-20px);transition:.3s}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:768px){.hamburger{display:block}.hero-card{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- Header -->
<header class="header">
  <div class="header-wrap">
    <div class="brand"><i class="fa-solid fa-store"></i> GHOTI BUILDER</div>
    <div class="header-right">
      <div class="lang-switch">
        <button id="langBn" class="active">বাংলা</button>
        <button id="langEn">English</button>
      </div>
      <img id="userAvatar" src="https://ui-avatars.com/api/?name=Shop" class="user-avatar">
      <button class="hamburger" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <h3 data-bn="সাপোর্ট" data-en="Support">সাপোর্ট</h3>
  <a href="https://build.ghotimarket.com/support" class="sidebar-link"><i class="fa-solid fa-headset"></i> <span data-bn="Support" data-en="Support">Support</span></a>
  <a href="https://build.ghotimarket.com/privacy-policy" class="sidebar-link"><i class="fa-solid fa-shield-halved"></i> <span data-bn="Privacy Policy" data-en="Privacy Policy">Privacy Policy</span></a>
  <a href="https://build.ghotimarket.com/terms" class="sidebar-link"><i class="fa-solid fa-file-contract"></i> <span data-bn="Terms" data-en="Terms">Terms</span></a>
  <a href="https://build.ghotimarket.com/subscription" class="sidebar-link"><i class="fa-solid fa-crown"></i> <span data-bn="Subscription" data-en="Subscription">Subscription</span></a>
</aside>

<div class="container" id="mainContent">
  <!-- Content loaded by JS -->
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
  authDomain: "ghotimarket.firebaseapp.com",
  projectId: "ghotimarket",
  storageBucket: "ghotimarket.firebasestorage.app",
  messagingSenderId: "481257644093",
  appId: "1:481257644093:web:0dfc3699d6b3c86afeca54"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentLang = localStorage.getItem('ghoti_lang') || 'bn';
let shopData = {};
let bannerIndex = 0;
let bannerInterval;

function applyLang(){
  document.body.classList.toggle('en', currentLang==='en');
  document.querySelectorAll('[data-bn]').forEach(el=>{
    el.textContent = currentLang==='bn' ? el.dataset.bn : el.dataset.en;
  });
  document.getElementById('langBn').classList.toggle('active', currentLang==='bn');
  document.getElementById('langEn').classList.toggle('active', currentLang==='en');
}
document.getElementById('langBn').onclick=()=>{currentLang='bn';localStorage.setItem('ghoti_lang','bn');applyLang();if(shopData.uid) renderDashboard()}
document.getElementById('langEn').onclick=()=>{currentLang='en';localStorage.setItem('ghoti_lang','en');applyLang();if(shopData.uid) renderDashboard()}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

document.getElementById('hamburgerBtn').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('show')}
document.getElementById('sidebarOverlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show')}

function getTimestampMillis(value) {
  if (!value) return null;
  if (typeof value === "number") return value;
  if (value?.toMillis) return value.toMillis();
  if (value instanceof Date) return value.getTime();
  return null;
}

onAuthStateChanged(auth, async (user)=>{
  if(!user){window.location.href = "https://build.ghotimarket.com/"; return;}
  const shopRef = doc(db, "shops", user.uid);
  const shopSnap = await getDoc(shopRef);
  if (shopSnap.exists()) {
    shopData = { ...shopSnap.data(), uid: user.uid };
    renderDashboard();
    loadBanners();
    startCountdown();
  } else {
    document.getElementById('mainContent').innerHTML = `
      <div class="error-card">
        <i class="fa-solid fa-circle-exclamation"></i>
        <h2 data-bn="আপনার Shop পাওয়া যায়নি" data-en="Shop Not Found">আপনার Shop পাওয়া যায়নি</h2>
        <p>UID: <code>${user.uid}</code></p>
        <button class="btn btn-primary" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> <span data-bn="Retry" data-en="Retry">Retry</span></button>
      </div>
    `;
    applyLang();
  }
});

function renderDashboard(){
  document.getElementById('mainContent').innerHTML = `
    <div class="hero-card">
      <img id="shopLogo" src="${shopData.shopLogo || `https://ui-avatars.com/api/?name=${encodeURIComponent(shopData.shopName || "Shop")}&size=128`}" class="shop-logo">
      <div class="shop-info">
        <h2>${shopData.shopName || 'My Shop'} ${shopData.verified ? '<span class="verified-badge"><i class="fa-solid fa-badge-check"></i> Verified</span>' : ''}</h2>
        <p>@${shopData.username || ''}</p>
        <p>${shopData.shopDescription || ''}</p>
      </div>
    </div>

    <div class="banner-slider" id="bannerSlider">
      <div class="banner-track" id="bannerTrack"></div>
      <div class="banner-dots" id="bannerDots"></div>
    </div>

    <div class="url-card">
      <div>
        <h3 data-bn="আপনার শপ লিংক" data-en="Your Shop Link">আপনার শপ লিংক</h3>
        <a id="shopUrl" class="url-link" href="#" target="_blank"></a>
      </div>
      <div style="display:flex;gap:8px">
        <a id="openShopBtn" class="btn btn-primary" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i><span data-bn="শপ দেখুন" data-en="Open Shop">শপ দেখুন</span></a>
        <button id="copyBtn" class="btn btn-ghost"><i class="fa-solid fa-copy"></i><span data-bn="কপি" data-en="Copy">কপি</span></button>
      </div>
    </div>

    <div class="grid">
      <a href="https://build.ghotimarket.com/order" class="card"><div class="card-icon"><i class="fa-solid fa-bag-shopping"></i></div><div class="card-content"><h3 data-bn="My Order" data-en="My Order">My Order</h3><p data-bn="অর্ডার দেখুন" data-en="View orders">অর্ডার দেখুন</p></div></a>
      <a href="https://build.ghotimarket.com/categories" class="card"><div class="card-icon"><i class="fa-solid fa-list"></i></div><div class="card-content"><h3 data-bn="Categories" data-en="Categories">Categories</h3><p data-bn="ক্যাটাগরি ম্যানেজ" data-en="Manage categories">ক্যাটাগরি ম্যানেজ</p></div></a>
      <a href="https://build.ghotimarket.com/product-manage" class="card"><div class="card-icon"><i class="fa-solid fa-boxes-stacked"></i></div><div class="card-content"><h3 data-bn="Product Manage" data-en="Product Manage">Product Manage</h3><p data-bn="প্রোডাক্ট এডিট" data-en="Edit products">প্রোডাক্ট এডিট</p></div></a>
      <a href="https://build.ghotimarket.com/product-upload" class="card"><div class="card-icon"><i class="fa-solid fa-upload"></i></div><div class="card-content"><h3 data-bn="Upload Product" data-en="Upload Product">Upload Product</h3><p data-bn="নতুন প্রোডাক্ট" data-en="Add new">নতুন প্রোডাক্ট</p></div></a>
      <a href="https://build.ghotimarket.com/domain" class="card"><div class="card-icon"><i class="fa-solid fa-globe"></i></div><div class="card-content"><h3 data-bn="Custom Domain" data-en="Custom Domain">Custom Domain</h3><p data-bn="ডোমেইন যুক্ত করুন" data-en="Connect domain">ডোমেইন যুক্ত করুন</p></div></a>
      <a href="https://build.ghotimarket.com/seo" class="card"><div class="card-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div><div class="card-content"><h3>SEO & Update</h3><p data-bn="SEO সেটিংস" data-en="SEO settings">SEO সেটিংস</p></div></a>
      <a href="https://build.ghotimarket.com/username" class="card"><div class="card-icon"><i class="fa-solid fa-user"></i></div><div class="card-content"><h3>Username</h3><p data-bn="ইউজারনেম" data-en="Username">ইউজারনেম</p></div></a>
      <a href="https://build.ghotimarket.com/subscription" class="card"><div class="card-icon"><i class="fa-solid fa-crown"></i></div><div class="card-content"><h3>Subscriptions</h3><p data-bn="প্ল্যান বিলিং" data-en="Plan billing">প্ল্যান বিলিং</p></div></a>
    </div>

    <div id="subscriptionCard" class="sub-card">
      <h3 data-bn="আপনার সাবস্ক্রিপশন" data-en="Your Subscription">আপনার সাবস্ক্রিপশন</h3>
      <p id="subStatus"></p>
      <div id="warningMsg" style="display:none;margin:12px 0;padding:10px;background:rgba(255,255,255,.2);border-radius:8px;font-size:12px"></div>
      <div class="countdown" id="countdown"></div>
      <a id="renewBtn" href="https://build.ghotimarket.com/subscription" class="btn" style="background:#fff;color:var(--primary);display:none"><i class="fa-solid fa-rotate"></i> <span data-bn="Renew Now" data-en="Renew Now">Renew Now</span></a>
    </div>

    <h2 style="margin-bottom:12px;font-size:16px" data-bn="শীঘ্রই আসছে" data-en="Coming Soon">শীঘ্রই আসছে</h2>
    <p style="color:var(--text-2);margin-bottom:12px;font-size:13px" data-bn="GHOTI BUILDER-এ আরও অনেক সুবিধা আসছে" data-en="More features coming to GHOTI BUILDER">GHOTI BUILDER-এ আরও অনেক সুবিধা আসছে</p>
    <div class="grid coming-grid">
      <div class="card"><div class="card-icon"><i class="fa-solid fa-chart-line"></i></div><div class="card-content"><h3>Analytics</h3></div></div>
      <div class="card"><div class="card-icon"><i class="fa-solid fa-bullhorn"></i></div><div class="card-content"><h3>Marketing</h3></div></div>
      <div class="card"><div class="card-icon"><i class="fa-solid fa-file-invoice"></i></div><div class="card-content"><h3>Reports</h3></div></div>
      <div class="card"><div class="card-icon"><i class="fa-solid fa-ticket"></i></div><div class="card-content"><h3>Coupons</h3></div></div>
    </div>
  `;
  
  updateShopUrl();
  applyLang();
  document.getElementById('copyBtn').onclick=()=>{navigator.clipboard.writeText(document.getElementById('shopUrl').textContent); showToast(currentLang==='bn'?'Shop link কপি হয়েছে':'Shop link copied')}
}

function updateShopUrl(){
  let url = '';
  if(shopData.customDomain){ url = `https://${shopData.customDomain}`; }
  else if(shopData.username){ url = `https://store.ghotimarket.com/@${shopData.username}`; }
  else{ url = '#'; }
  
  document.getElementById('shopUrl').textContent = shopData.username ? url : (currentLang==='bn'?'Shop username not configured':'Shop username not configured');
  document.getElementById('shopUrl').href = shopData.username ? url : '#';
  document.getElementById('openShopBtn').href = shopData.username ? url : '#';
}

async function loadBanners(){
  try{
    const snap = await getDocs(query(collection(db, "shops_banner"), orderBy("createdAt", "desc")));
    const track = document.getElementById('bannerTrack');
    const dots = document.getElementById('bannerDots');
    if(!track) return;
    
    if(snap.empty){
      track.innerHTML = `<div class="banner-slide"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:#fff;font-size:20px;font-weight:700">GHOTI BUILDER</div></div>`;
      return;
    }
    
    snap.docs.forEach((d, i)=>{
      const data = d.data();
      track.innerHTML += `<div class="banner-slide"><img src="${data.imageUrl}" alt="Banner"></div>`;
      dots.innerHTML += `<div class="banner-dot ${i===0?'active':''}" onclick="goToBanner(${i})"></div>`;
    });
    
    if(snap.size > 1){
      bannerInterval = setInterval(()=>{bannerIndex = (bannerIndex + 1) % snap.size; updateBanner()}, 4000);
    }
  }catch(e){console.error(e)}
}
window.goToBanner = (i)=>{bannerIndex = i; updateBanner()}
function updateBanner(){document.getElementById('bannerTrack').style.transform = `translateX(-${bannerIndex * 100}%)`; document.querySelectorAll('.banner-dot').forEach((d,i)=>d.classList.toggle('active', i===bannerIndex))}

function startCountdown(){
  const expiry = getTimestampMillis(shopData.profileUnlocked);
  if(!expiry){document.getElementById('subStatus').textContent = currentLang==='bn'?"Subscription date not available":"Subscription date not available"; return;}
  
  setInterval(()=>{
    const diff = expiry - Date.now();
    const card = document.getElementById('subscriptionCard');
    const renew = document.getElementById('renewBtn');
    const warn = document.getElementById('warningMsg');
    
    if(diff<=0){
      document.getElementById('subStatus').textContent=currentLang==='bn'?'আপনার সাবস্ক্রিপশনের মেয়াদ শেষ হয়েছে।':'Your subscription has expired.';
      card.classList.add('expired'); renew.style.display='inline-flex'; warn.style.display='none';
      document.getElementById('countdown').innerHTML = '';
      return;
    }
    
    const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
    document.getElementById('countdown').innerHTML = `
      <div class="count-box"><div class="num">${String(d).padStart(2,'0')}</div><div class="label" data-bn="দিন" data-en="Days">দিন</div></div>
      <div class="count-box"><div class="num">${String(h).padStart(2,'0')}</div><div class="label" data-bn="ঘণ্টা" data-en="Hours">ঘণ্টা</div></div>
      <div class="count-box"><div class="num">${String(m).padStart(2,'0')}</div><div class="label" data-bn="মিনিট" data-en="Minutes">মিনিট</div></div>
      <div class="count-box"><div class="num">${String(s).padStart(2,'0')}</div><div class="label" data-bn="সেকেন্ড" data-en="Seconds">সেকেন্ড</div></div>`;
    
    document.getElementById('subStatus').textContent=currentLang==='bn'?'আপনার সাবস্ক্রিপশন সক্রিয়':'Your subscription is active';
    card.classList.remove('expired'); renew.style.display='none';
    
    if(diff<=3*86400000){
      card.classList.add('warning');
      warn.style.display='block';
      warn.textContent=currentLang==='bn'?'আপনার সাবস্ক্রিপশন শেষ হয়ে যাবে। এখনই রিনিউ করুন।':'Your subscription will expire soon. Renew now.';
    }else{card.classList.remove('warning'); warn.style.display='none'}
  },1000)
}
applyLang();
</script>
